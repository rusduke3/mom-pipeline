repos:
  - repo: local
    hooks:
      - id: bandit-sast
        name: Bandit SAST Security Check
        entry: .venv/Scripts/bandit.exe
        args: ["-r", "app"]
        pass_filenames: false
        language: system

      - id: block-secrets-files
        name: Block .env and VPN private configs
        entry: .venv/Scripts/python.exe -c "import sys; bad=[f for f in sys.argv[1:] if f=='.env' or f.endswith('.conf') or f=='vpn/config.json']; sys.exit(1 if bad else 0)"
        language: system
